<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shopee OTP</title>
    <style>
        /* RESET & FONT */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        body { background-color: #f5f5f5; color: #333; display: flex; justify-content: center; }
        
        /* BINGKAI APLIKASI */
        .app-container { width: 100%; max-width: 480px; background-color: #fff; min-height: 100vh; position: relative; padding-bottom: 60px; box-shadow: 0 0 10px rgba(0,0,0,0.1); overflow-x: hidden; }

        /* HEADER ORANYE KHAS SHOPEE */
        .header { background: linear-gradient(-180deg,#f53d2d,#f63); padding: 12px 15px; display: flex; align-items: center; gap: 15px; position: sticky; top: 0; z-index: 100; }
        .search-bar { background: #fff; border-radius: 3px; padding: 8px 10px; flex: 1; display: flex; align-items: center; color: #ee4d2d; font-size: 14px; }
        .search-bar span { color: #888; margin-left: 8px; }
        .header-icons { color: white; font-size: 22px; display: flex; gap: 15px; }

        /* DOMPET / SALDO */
        .wallet-section { display: flex; padding: 12px; background: #fff; border-bottom: 6px solid #f5f5f5; }
        .wallet-item { flex: 1; display: flex; flex-direction: column; padding: 0 10px; border-right: 1px solid #eee; }
        .wallet-item:last-child { border-right: none; }
        .wallet-title { font-size: 12px; color: #333; display: flex; align-items: center; gap: 5px; margin-bottom: 4px; font-weight: bold; }
        .wallet-value { font-size: 13px; color: #ee4d2d; font-weight: bold; }
        .wallet-desc { font-size: 10px; color: #888; }

        /* MENU GRID DENGAN LOGO ASLI */
        .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px 10px; padding: 15px; background: #fff; }
        .menu-item { display: flex; flex-direction: column; align-items: center; text-align: center; font-size: 11px; color: #333; cursor: pointer; }
        .menu-icon { width: 45px; height: 45px; border-radius: 15px; background: #f5f5f5; display: flex; justify-content: center; align-items: center; margin-bottom: 5px; border: 1px solid #eee; overflow: hidden; }
        /* Ukuran gambar logo agar pas di dalam kotak */
        .menu-icon img { width: 28px; height: 28px; object-fit: contain; }
        
        /* BANNER PROMO */
        .banner-container { padding: 10px; background: #fff; }
        .banner { width: 100%; height: 120px; background: linear-gradient(45deg, #ff7337, #ff253a); border-radius: 5px; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 20px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }

        /* BOTTOM NAVIGATION */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: #fff; display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid #ddd; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #999; cursor: pointer; }
        .nav-item.active { color: #ee4d2d; }
        .nav-icon { font-size: 20px; margin-bottom: 3px; }

        /* POPUP DISKON */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 999; display: flex; justify-content: center; align-items: center; }
        .popup { background: transparent; text-align: center; position: relative; width: 80%; max-width: 300px; }
        .popup-img { width: 100%; background: linear-gradient(180deg, #ffea00, #ff5722); padding: 30px 20px; border-radius: 15px; color: white; box-shadow: 0 5px 15px rgba(0,0,0,0.3); border: 3px solid white; }
        .popup-title { font-size: 30px; font-weight: 900; line-height: 1; text-shadow: 2px 2px 0 #d84315; margin-bottom: 10px; }
        .popup-btn { background: #003c8f; color: white; padding: 10px 20px; border-radius: 20px; font-weight: bold; border: none; width: 100%; font-size: 16px; margin-top: 15px; cursor: pointer; }
        .close-btn { position: absolute; top: -15px; right: -15px; background: white; color: #333; width: 30px; height: 30px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- HEADER -->
    <div class="header">
        <div class="search-bar">
            🔍 <span>Cari Layanan OTP...</span>
        </div>
        <div class="header-icons">
            🛒 💬
        </div>
    </div>

    <!-- WALLET / SALDO -->
    <div class="wallet-section">
        <div class="wallet-item">
            <div class="wallet-title">💳 Saldo OTP</div>
            <div class="wallet-value" id="saldo-display">Memuat...</div>
            <div class="wallet-desc" id="nama-display">Tunggu sebentar</div>
        </div>
        <div class="wallet-item">
            <div class="wallet-title">🪙 Koin Reward</div>
            <div class="wallet-value" style="color: #f6a700;">150</div>
            <div class="wallet-desc">Klaim tiap hari!</div>
        </div>
    </div>

    <!-- MENU GRID LAYANAN (MENGGUNAKAN LOGO ASLI) -->
    <div class="menu-grid">
        <div class="menu-item" onclick="bukaLayanan('WhatsApp')">
            <div class="menu-icon">
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
            </div>
            WhatsApp
        </div>
        <div class="menu-item" onclick="bukaLayanan('Telegram')">
            <div class="menu-icon">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram">
            </div>
            Telegram
        </div>
        <div class="menu-item" onclick="bukaLayanan('Instagram')">
            <div class="menu-icon">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" alt="Instagram">
            </div>
            Instagram
        </div>
        <div class="menu-item" onclick="bukaLayanan('Gojek')">
            <div class="menu-icon">
                <img src="https://upload.wikimedia.org/wikipedia/commons/9/99/Gojek_logo_2019.svg" alt="Gojek">
            </div>
            Gojek
        </div>
        <div class="menu-item" onclick="bukaLayanan('Shopee')">
            <div class="menu-icon">
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/fe/Shopee.svg" alt="Shopee">
            </div>
            Shopee
        </div>
        <div class="menu-item" onclick="bukaLayanan('Facebook')">
            <div class="menu-icon">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook">
            </div>
            Facebook
        </div>
        <div class="menu-item" onclick="bukaLayanan('YouTube')">
            <div class="menu-icon">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg" alt="YouTube">
            </div>
            YouTube
        </div>
        <div class="menu-item">
            <div class="menu-icon" style="font-size: 20px;">
                ⚙️
            </div>
            Lainnya
        </div>
    </div>

    <!-- BANNER -->
    <div class="banner-container">
        <div class="banner">
            🔥 DISKON OTP 50% HARI INI!
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <div class="nav-icon">🏠</div>
            Beranda
        </div>
        <div class="nav-item">
            <div class="nav-icon">📋</div>
            Pesanan
        </div>
        <div class="nav-item">
            <div class="nav-icon">🔔</div>
            Notifikasi
        </div>
        <div class="nav-item">
            <div class="nav-icon">👤</div>
            Saya
        </div>
    </div>

    <!-- POPUP DISKON -->
    <div class="overlay" id="promo-popup">
        <div class="popup">
            <div class="close-btn" onclick="tutupPopup()">X</div>
            <div class="popup-img">
                <div style="font-size: 14px; margin-bottom: 5px;">% Spesial Pengguna Baru</div>
                <div class="popup-title">DISKON<br>DAHSYAT<br>100%</div>
                <button class="popup-btn" onclick="tutupPopup()">PAKAI SEKARANG</button>
            </div>
        </div>
    </div>

</div>

<script>
    // Fungsi Tutup Popup
    function tutupPopup() {
        document.getElementById('promo-popup').style.display = 'none';
    }

    // Fungsi Panggil API Vercel (Backend Anda)
    async function callCodeOTP(endpoint, method = 'POST', payload = {}) {
        try {
            const response = await fetch('/api/codeotp', {
                method: 'POST', // Ke Vercel tetap POST
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    endpoint: endpoint,
                    apiMethod: method, // Beritahu Vercel untuk pakai POST ke CodeOTP
                    payload: payload
                })
            });
            return await response.json();
        } catch (error) {
            return { status: false, message: error.message };
        }
    }

    // Ambil Saldo Asli dari CodeOTP
    async function loadSaldo() {
        // SESUAI DOKUMENTASI: Gunakan POST untuk ambil profil
        const result = await callCodeOTP('/v1/profil', 'POST'); 
        
        if (result.status && result.data) {
            const saldoFormat = new Intl.NumberFormat('id-ID').format(result.data.balance || 0);
            document.getElementById('saldo-display').innerText = 'Rp ' + saldoFormat;
            document.getElementById('nama-display').innerText = result.data.name || 'Pengguna';
        } else {
            document.getElementById('saldo-display').innerText = 'Rp 0';
            document.getElementById('nama-display').innerText = 'Gagal muat API';
            console.error("Error dari API:", result.message);
        }
    }

    // Fungsi sementara saat logo diklik
    function bukaLayanan(namaLayanan) {
        // Nanti di sini kita buat logika untuk memanggil API /v1/server dan /v1/layanan
        console.log("Membuka layanan: " + namaLayanan);
        alert("Anda memilih " + namaLayanan + ". Tahap selanjutnya adalah memanggil API /v1/server dan /v1/harga.");
    }

    // Jalankan saat web dibuka
    window.onload = () => {
        loadSaldo();
    };
</script>

</body>
</html>
