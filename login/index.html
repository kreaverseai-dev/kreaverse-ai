<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Masuk - Flixa AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* =================================================== */
        /* UI STYLE ALA MAGNIFIC (DARK MODE PREMIUM)           */
        /* =================================================== */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Inter', sans-serif; background-color: #000;
            overflow: hidden; -webkit-user-select: none; user-select: none;
        }

        /* Background Image & Overlay */
        .bg-image {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            /* Gambar background ala Magnific (Bisa diganti link gambarnya nanti) */
            background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop');
            background-size: cover; background-position: center; z-index: 1;
        }
        .bg-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.8) 60%, rgba(0,0,0,1) 100%);
            z-index: 2;
        }

        /* Main Content Container */
        .content-wrapper {
            position: relative; z-index: 10; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-end; height: 100%; padding: 40px 20px 60px 20px;
            box-sizing: border-box;
        }

        /* Logo Flixa AI */
        .logo-container {
            position: absolute; top: 15%; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 12px;
        }
        .logo-svg { width: 45px; height: 45px; }
        .logo-text { font-size: 28px; font-weight: 800; color: #FFF; letter-spacing: -0.5px; }

        /* Buttons (Pill Style) */
        .btn-container { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 16px; }
        
        .btn-magnific {
            width: 100%; background: #FFF; color: #000; border: none; padding: 16px;
            border-radius: 99px; font-size: 16px; font-weight: 700; font-family: 'Inter', sans-serif;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            cursor: pointer; transition: transform 0.2s, opacity 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn-magnific:active { transform: scale(0.96); }
        .btn-magnific i { font-size: 18px; }
        .btn-magnific.disabled { opacity: 0.5; pointer-events: none; }

        /* Email Form (Hidden by default) */
        .email-form-wrapper {
            width: 100%; max-width: 340px; display: none; flex-direction: column; gap: 12px;
            animation: slideUp 0.3s ease forwards;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .email-input {
            width: 100%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: #FFF; padding: 16px 20px; border-radius: 99px; font-size: 15px; font-family: 'Inter', sans-serif;
            box-sizing: border-box; outline: none; text-align: center; backdrop-filter: blur(10px);
        }
        .email-input::placeholder { color: rgba(255,255,255,0.5); }
        .email-input:focus { border-color: #FFF; }
        
        .btn-submit-email {
            width: 100%; background: #FFF; color: #000; border: none; padding: 16px;
            border-radius: 99px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .btn-submit-email:active { transform: scale(0.96); }
        
        .btn-back {
            background: none; border: none; color: rgba(255,255,255,0.6); font-size: 14px;
            font-weight: 600; cursor: pointer; margin-top: 10px; padding: 10px;
        }

        /* Footer Text */
        .footer-text {
            margin-top: 30px; font-size: 13px; color: rgba(255,255,255,0.5); font-weight: 500;
        }
        .footer-text span { color: #FFF; font-weight: 600; cursor: pointer; }

        /* Sleek Toast Notification */
        .sleek-toast {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); color: #000; padding: 12px 20px;
            border-radius: 99px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 9999; pointer-events: none; white-space: nowrap;
        }
        .sleek-toast.show { top: 40px; }
        .sleek-toast.error { background: #FF3B30; color: #FFF; }
        .sleek-toast.success { background: #10B981; color: #FFF; }

        /* Loading Spinner */
        .spinner { width: 18px; height: 18px; border: 2px solid rgba(0,0,0,0.2); border-top-color: #000; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        .btn-submit-email .spinner { border: 2px solid rgba(0,0,0,0.2); border-top-color: #000; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <!-- Sleek Toast Notification -->
    <div id="toast" class="sleek-toast">
        <i id="toast-icon" class="fa-solid fa-circle-info"></i>
        <span id="toast-msg">Pesan notifikasi</span>
    </div>

    <div class="content-wrapper">
        <!-- Logo Flixa AI -->
        <div class="logo-container">
            <svg class="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
                <defs>
                    <linearGradient id="flixaPremium" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#1A1449" />
                        <stop offset="50%" stop-color="#7B2956" />
                        <stop offset="100%" stop-color="#D95040" />
                    </linearGradient>
                </defs>
                <rect width="500" height="500" rx="120" fill="url(#flixaPremium)"/>
                <path d="M 320 160 C 320 60, 190 60, 190 200 C 190 290, 230 320, 230 400" stroke="#FFFFFF" stroke-width="70" stroke-linecap="round" fill="none" />
                <path d="M 120 250 Q 210 200 300 250" stroke="#FFFFFF" stroke-width="70" stroke-linecap="round" fill="none" />
            </svg>
            <div class="logo-text">Flixa AI</div>
        </div>

        <!-- Main Buttons -->
        <div class="btn-container" id="mainButtons">
            <button class="btn-magnific" id="btnGoogle">
                <i class="fa-brands fa-google"></i> <span id="textGoogle">Log in with Google</span>
                <div class="spinner" id="spinGoogle"></div>
            </button>
            <button class="btn-magnific" id="btnShowEmail">
                <i class="fa-regular fa-envelope"></i> Log in with email
            </button>
        </div>

        <!-- Email Form -->
        <div class="email-form-wrapper" id="emailForm">
            <input type="email" id="emailInput" class="email-input" placeholder="Enter client email" autocomplete="off" spellcheck="false">
            <button class="btn-submit-email" id="btnSubmitEmail">
                <span id="textEmail">Continue</span>
                <div class="spinner" id="spinEmail"></div>
            </button>
            <button class="btn-back" id="btnBackToMain">Cancel</button>
        </div>

        <div class="footer-text">
            Don't have an account yet? <span onclick="showToast('Silakan hubungi Admin untuk berlangganan.', 'info')">Sign up</span>
        </div>
    </div>

    <!-- FIREBASE MODULAR SDK -->
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, setDoc, updateDoc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getDatabase, ref, set, onValue, onDisconnect, serverTimestamp as rtdbTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAO8JV4jkJmbHChYvjUCS7wqfVbKr94tHM",
        authDomain: "kreaverse-ai0107.firebaseapp.com",
        databaseURL: "https://kreaverse-ai0107-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "kreaverse-ai0107",
        storageBucket: "kreaverse-ai0107.firebasestorage.app",
        messagingSenderId: "1048550433011",
        appId: "1:1048550433011:web:0cf2e4074b20fe09909786"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const rtdb = getDatabase(app);
    const googleProvider = new GoogleAuthProvider();

    // EMAIL ADMIN DITAMBAHKAN FLIXA.AI.OFFICIAL
    const ALLOWED_ADMINS = [
        "holifhidayah@gmail.com",
        "alluraveylia@gmail.com",
        "kreaverse.ai@gmail.com",
        "habigeneratewebsite@gmail.com",
        "habiwebsite@gmail.com",
        "flixa.ai.official@gmail.com"
    ];

    // ============================================================
    // UI LOGIC (TOAST & FORM TOGGLE)
    // ============================================================
    window.showToast = function(msg, type = 'info') {
        const toast = document.getElementById('toast');
        const icon = document.getElementById('toast-icon');
        document.getElementById('toast-msg').innerText = msg;
        
        toast.className = 'sleek-toast'; // reset
        if(type === 'error') { toast.classList.add('error'); icon.className = 'fa-solid fa-triangle-exclamation'; }
        else if(type === 'success') { toast.classList.add('success'); icon.className = 'fa-solid fa-circle-check'; }
        else { icon.className = 'fa-solid fa-circle-info'; }
        
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3500);
    }

    document.getElementById('btnShowEmail').addEventListener('click', () => {
        document.getElementById('mainButtons').style.display = 'none';
        document.getElementById('emailForm').style.display = 'flex';
        document.getElementById('emailInput').focus();
    });

    document.getElementById('btnBackToMain').addEventListener('click', () => {
        document.getElementById('emailForm').style.display = 'none';
        document.getElementById('mainButtons').style.display = 'flex';
    });

    function setLoading(btnId, isLoading) {
        const btn = document.getElementById(btnId);
        const text = document.getElementById(btnId === 'btnGoogle' ? 'textGoogle' : 'textEmail');
        const spin = document.getElementById(btnId === 'btnGoogle' ? 'spinGoogle' : 'spinEmail');
        const icon = btn.querySelector('i');
        
        if(isLoading) {
            btn.classList.add('disabled');
            text.style.display = 'none';
            if(icon) icon.style.display = 'none';
            spin.style.display = 'block';
        } else {
            btn.classList.remove('disabled');
            text.style.display = 'block';
            if(icon) icon.style.display = 'block';
            spin.style.display = 'none';
        }
    }

    // ============================================================
    // SUCCESS LOGIN HANDLER (NATIVE APP FEEL)
    // ============================================================
    function handleLoginSuccess(data) {
        localStorage.setItem('kreaverse_logged_in', 'true');
        localStorage.setItem('kreaverse_user_email', data.email);
        localStorage.setItem('kreaverse_user_id', data.uid);
        localStorage.setItem('kreaverse_user_name', data.name);
        localStorage.setItem('kreaverse_role', data.role);
        localStorage.setItem('kreaverse_tier', data.tier);
        localStorage.setItem('kreaverse_credits', String(data.credits ?? 0));

        showToast('Login Berhasil! Memuat ruang kerja...', 'success');
        
        // LOGIKA MENYATU DENGAN BERANDA (TANPA REDIRECT)
        setTimeout(() => {
            if (window.parent && window.parent.initUser && window.parent.closeTool) {
                window.parent.initUser(); // Refresh data di beranda
                window.parent.closeTool(); // Tutup iframe login
            } else {
                window.location.href = '/'; // Fallback jika dibuka langsung
            }
        }, 1500);
    }

    async function setPresenceOnline(uid) {
        if (!uid || !rtdb) return;
        const userRef = ref(rtdb, '/presence/' + uid);
        const connectedRef = ref(rtdb, '.info/connected');
        onValue(connectedRef, async (snap) => {
            if (snap.val() === true) {
                await onDisconnect(userRef).set({ state: 'offline', last_changed: rtdbTimestamp() });
                await set(userRef, { state: 'online', last_changed: rtdbTimestamp(), page: 'Flixa AI' });
            }
        });
    }

    // ============================================================
    // GOOGLE LOGIN (ADMIN)
    // ============================================================
    document.getElementById('btnGoogle').addEventListener('click', async () => {
        setLoading('btnGoogle', true);
        try {
            const result = await signInWithPopup(auth, googleProvider);
            const user = result.user;
            
            if (ALLOWED_ADMINS.includes(user.email.toLowerCase())) {
                const usersRef = collection(db, 'users');
                const q = query(usersRef, where('email', '==', user.email.toLowerCase()));
                const snapshot = await getDocs(q);
                
                let adminUid = user.uid;
                if (snapshot.empty) {
                    await setDoc(doc(db, 'users', adminUid), {
                        email: user.email.toLowerCase(), role: 'admin', tier: 'max_lifetime',
                        nama: user.displayName || 'Admin', createdAt: serverTimestamp(), lastLogin: serverTimestamp()
                    });
                } else {
                    adminUid = snapshot.docs[0].id;
                    await updateDoc(doc(db, 'users', adminUid), { lastLogin: serverTimestamp() });
                }

                await setPresenceOnline(adminUid);
                handleLoginSuccess({ email: user.email, uid: adminUid, name: user.displayName || 'Admin', role: 'admin', tier: 'max', credits: -1 });
            } else {
                await signOut(auth);
                showToast('Akses Ditolak. Gunakan email klien.', 'error');
                setLoading('btnGoogle', false);
            }
        } catch (error) {
            showToast(error.message, 'error');
            setLoading('btnGoogle', false);
        }
    });

    // ============================================================
    // EMAIL LOGIN (USER)
    // ============================================================
    document.getElementById('btnSubmitEmail').addEventListener('click', async () => {
        const email = document.getElementById('emailInput').value.toLowerCase().trim();
        if (!email) { showToast('Masukkan email Anda', 'error'); return; }

        setLoading('btnSubmitEmail', true);
        try {
            try { await signInAnonymously(auth); } catch (e) {}

            const usersRef = collection(db, 'users');
            const q = query(usersRef, where('email', '==', email));
            const snapshot = await getDocs(q);

            if (snapshot.empty) {
                await signOut(auth);
                showToast('Email tidak terdaftar.', 'error');
                setLoading('btnSubmitEmail', false);
                return;
            }

            const docSnap = snapshot.docs[0];
            const data = docSnap.data();
            const uid = docSnap.id;

            if (data.blocked === true) {
                await signOut(auth);
                showToast('Akun Anda sedang diblokir Admin.', 'error');
                setLoading('btnSubmitEmail', false);
                return;
            }

            const tier = data.tier || 'basic';
            const credits = data.credits ?? 0;

            await updateDoc(doc(db, 'users', uid), { lastLogin: serverTimestamp() });
            await setPresenceOnline(uid);
            handleLoginSuccess({ email, uid, name: data.nama || '', role: 'user', tier, credits });

        } catch (err) {
            showToast('Gagal terhubung ke server.', 'error');
            setLoading('btnSubmitEmail', false);
        }
    });
    </script>
</body>
</html>
